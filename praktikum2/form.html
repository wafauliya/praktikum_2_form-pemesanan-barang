<!DOCTYPE html>
</html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
</head>
<body>
  <h1>Black goese bistro | Pizza-on-Demand</h1>
  <p>
    our 12&quet; wood-fired pizzas are available for delivery.
    </p>
    <form action="http://www.blackgoosebistro.com/pizza.php" method="post">
      <fieldset>
        <legend>your information</legend>
        <p>
        <label for="name">Name: </label>
        <input type="name" id="name">
        </p>
        
        <p>
          <label for="address">Address: </label>
          <input type="text" id="address" name="address">
        </p>
        
        <p>
        <label for="phone">Phone: </label>
        <input type="tel" id="phone" name="phone">
        </p>
        
        <p>
          <label for="email">Email: </label>
          <input type="email" id="email" name="email">
        </p>
        
        <p>
          <label for="intructions">delivery intructions: </label><br>
           <textarea
            id="intructions"
           name="intructions"
           rows="4"
           cols="50"
           maxlength="400"
           placeholder="no more than 400 characters".>
        </textarea>
        </p>
      </fieldset>
      
      <fieldset>
        <legend>design your dream pizza</legend>
        <p>pizza specs</p>
        <p>pilih 1:</p>
        
        <p>
          <input type="radio" id="classic" name="crust" value="Classic white" required>
          <label for="classic">Classic white</label><br>
          
           <input type="radio" id="multigrain" name="crust" value="multigrain" required>
          <label for="multigrain">Multigrain</label><br>
          
           <input type="radio" id="Cheese" name="crust" value="Cheese" required>
          <label for="Cheese">Cheese</label><br>
          
          <input type="radio" id="Gluten" name="crust" value="Gluten" required>
          <label for="Gluten">Gluten</label><br>
        </p>
        
        <p>toping</p>
        
        <p>
         
          <input type="checkbox" id="redsauce"
          name="toppings" value="Red sauce"checked>
          <label for="redsauce">Red sauce</label><br>
          
           <input type="checkbox" id="whitsauce"
          name="toppings" value="White sauce">
          <label for="whitesauce">White sauce</label><br>
          
           <input type="checkbox" id="mozzarellacheese"
          name="toppings" value="Mozzarella cheese">
          <label for="mozzarelacheese">Mozzarella cheese</label><br>
          
           <input type="checkbox" id="pepperoni"
          name="toppings" value="Pepperoni">
          <label for="pepperoni">Pepperoni</label><br>
          
           <input type="checkbox" id="mushrooms"
          name="toppings" value="Mushrooms">
          <label for="mushrooms">Mushrooms</label><br>
          
           <input type="checkbox" id="peppers"
          name="toppings" value="Peppers">
          <label for="peppers">Peppers</label><br>
          
           <input type="checkbox" id="anchovies"
          name="toppings" value="Anchovies" >
          <label for="anchovies">Anchovies</label><br>
          
        </p>
        
        <p>
          <label for="quantity">Quantity: </label>
          <input type="number" id="quantity"
          name="quantity" min="1" max="10"
        </p>
      </fieldset>
      <p>
        <input type="submit" value="submit">
        <input type="reset" value="reset">
      </p>
    </form>
</body>

</html>
